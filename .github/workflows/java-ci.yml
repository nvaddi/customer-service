name: Java CI

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Select the branch to test
        type: choice
        required: true
        default: master
        options:
          - master
          - test-branch
      runner:
        description: Select the runner label
        type: choice
        required: true
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - ubuntu-22.04
          - windows-latest

jobs:
  test:
    runs-on: ${{inputs.runner}}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw test
