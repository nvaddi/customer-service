server:
  port: 8080

spring:
  application:
    name: CUSTOMER-SERVICE

  datasource:
    driver-class-name: ${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    url: ${DB_URL:jdbc:mysql://localhost:3306/demo}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Devuser@12}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    generate-ddl: true
    show-sql: true
